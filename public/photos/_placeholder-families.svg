<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="A family sharing a letter from Santa">
  <defs>
    <radialGradient id="fb" cx="50%" cy="42%" r="78%"><stop offset="0" stop-color="#3a2a1a"/><stop offset="100%" stop-color="#180f0b"/></radialGradient>
    <radialGradient id="fg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd98a" stop-opacity="0.85"/><stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#fb)"/>
  <g><circle cx="180" cy="160" r="48" fill="url(#fg)"/><circle cx="1010" cy="150" r="64" fill="url(#fg)"/><circle cx="1080" cy="430" r="40" fill="url(#fg)"/><circle cx="150" cy="430" r="34" fill="url(#fg)"/></g>
  <!-- glowing letter in the middle -->
  <circle cx="600" cy="600" r="230" fill="url(#fg)" opacity="0.7"/>
  <g transform="rotate(-4 600 600)">
    <rect x="470" y="500" width="260" height="200" rx="10" fill="#fbf4e2" stroke="#c9b489" stroke-width="2"/>
    <rect x="486" y="516" width="228" height="168" rx="4" fill="none" stroke="#9e2b25" stroke-width="2"/>
    <g stroke="#5a4632" stroke-width="4" stroke-linecap="round" opacity="0.5"><line x1="506" y1="556" x2="694" y2="556"/><line x1="506" y1="586" x2="676" y2="586"/><line x1="506" y1="616" x2="694" y2="616"/></g>
    <circle cx="600" cy="660" r="16" fill="#9e2b25"/>
  </g>
  <!-- family silhouettes -->
  <g fill="#160d0a">
    <!-- parent (center) -->
    <circle cx="600" cy="300" r="62"/>
    <path d="M508 760 C508 560 692 560 692 760 Z"/>
    <!-- child left -->
    <circle cx="380" cy="400" r="48"/>
    <path d="M300 770 C300 600 460 600 460 770 Z"/>
    <!-- child right -->
    <circle cx="820" cy="400" r="48"/>
    <path d="M740 770 C740 600 900 600 900 770 Z"/>
  </g>
</svg>
