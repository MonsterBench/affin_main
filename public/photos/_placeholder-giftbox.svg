<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-label="A North Pole gift box with a letter">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#7d201d"/><stop offset="100%" stop-color="#4a1210"/>
    </radialGradient>
    <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd98a" stop-opacity="0.85"/><stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
    <linearGradient id="pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4e2"/><stop offset="1" stop-color="#eaddbe"/></linearGradient>
  </defs>
  <rect width="1200" height="1000" fill="url(#bg)"/>
  <circle cx="220" cy="180" r="60" fill="url(#g)"/><circle cx="1000" cy="160" r="70" fill="url(#g)"/><circle cx="1040" cy="820" r="50" fill="url(#g)"/>
  <!-- box base -->
  <rect x="320" y="520" width="560" height="360" rx="16" fill="#9e2b25" stroke="#7d201d" stroke-width="4"/>
  <!-- letter peeking -->
  <g transform="rotate(-6 600 470)">
    <rect x="430" y="250" width="340" height="320" rx="10" fill="url(#pap)" stroke="#c9b489" stroke-width="2"/>
    <rect x="450" y="270" width="300" height="280" rx="4" fill="none" stroke="#9e2b25" stroke-width="2"/>
    <text x="470" y="320" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#3a2a1a">Dear Emma,</text>
    <g stroke="#5a4632" stroke-width="4" stroke-linecap="round" opacity="0.5"><line x1="470" y1="356" x2="720" y2="356"/><line x1="470" y1="384" x2="700" y2="384"/><line x1="470" y1="412" x2="720" y2="412"/><line x1="470" y1="440" x2="650" y2="440"/></g>
    <circle cx="600" cy="500" r="22" fill="#9e2b25"/><text x="600" y="508" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#f4d7a1">K</text>
  </g>
  <!-- box lid + ribbon -->
  <rect x="300" y="470" width="600" height="80" rx="12" fill="#b5392f"/>
  <rect x="560" y="470" width="80" height="410" fill="#e0bd6c" opacity="0.95"/>
  <path d="M600 470 C540 410 470 430 520 490 C560 510 600 500 600 470 Z" fill="#e0bd6c"/>
  <path d="M600 470 C660 410 730 430 680 490 C640 510 600 500 600 470 Z" fill="#d4a73f"/>
  <!-- candy cane -->
  <g transform="translate(330 430) rotate(20)" stroke="#fff" stroke-width="10"><path d="M0 120 V40 a26 26 0 0 1 52 0" fill="none" stroke="#9e2b25" stroke-width="22"/><path d="M0 120 V40 a26 26 0 0 1 52 0" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="14 14"/></g>
</svg>
