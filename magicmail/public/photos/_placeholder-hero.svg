<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="A letter from Santa by candlelight">
  <defs>
    <radialGradient id="warm" cx="62%" cy="38%" r="80%">
      <stop offset="0" stop-color="#3a2a1a"/>
      <stop offset="55%" stop-color="#241712"/>
      <stop offset="100%" stop-color="#160d0a"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbf4e2"/>
      <stop offset="1" stop-color="#efe1c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#warm)"/>
  <!-- bokeh lights -->
  <g>
    <circle cx="180" cy="140" r="46" fill="url(#glow)"/>
    <circle cx="980" cy="120" r="60" fill="url(#glow)"/>
    <circle cx="1080" cy="320" r="38" fill="url(#glow)"/>
    <circle cx="120" cy="360" r="30" fill="url(#glow)"/>
    <circle cx="820" cy="80" r="26" fill="url(#glow)"/>
  </g>
  <!-- candle glow -->
  <circle cx="240" cy="560" r="150" fill="url(#glow)" opacity="0.7"/>
  <!-- lantern -->
  <g transform="translate(180 470)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#2a1a10" stroke="#7a5a32" stroke-width="4"/>
    <rect x="18" y="22" width="84" height="106" rx="6" fill="#1c1109"/>
    <ellipse cx="60" cy="90" rx="20" ry="34" fill="#ffcf6b"/>
    <ellipse cx="60" cy="96" rx="9" ry="20" fill="#fff3cf"/>
    <rect x="40" y="-18" width="40" height="20" rx="6" fill="#7a5a32"/>
  </g>
  <!-- letter -->
  <g transform="rotate(-5 720 470)">
    <rect x="470" y="180" width="540" height="560" rx="14" fill="url(#paper)" stroke="#c9b489" stroke-width="2"/>
    <rect x="500" y="210" width="480" height="500" rx="6" fill="none" stroke="#9e2b25" stroke-width="3"/>
    <rect x="506" y="216" width="468" height="488" rx="4" fill="none" stroke="#9e2b25" stroke-width="1" opacity="0.6"/>
    <!-- holly corners -->
    <g fill="#2c6b45"><circle cx="520" cy="232" r="7"/><circle cx="536" cy="240" r="7"/><circle cx="528" cy="252" r="7"/></g>
    <circle cx="540" cy="246" r="4" fill="#9e2b25"/>
    <g fill="#2c6b45"><circle cx="958" cy="232" r="7"/><circle cx="942" cy="240" r="7"/><circle cx="950" cy="252" r="7"/></g>
    <circle cx="940" cy="246" r="4" fill="#9e2b25"/>
    <!-- text -->
    <text x="540" y="320" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#3a2a1a">Dear Emma,</text>
    <g stroke="#5a4632" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <line x1="540" y1="370" x2="930" y2="370"/>
      <line x1="540" y1="410" x2="900" y2="410"/>
      <line x1="540" y1="450" x2="935" y2="450"/>
      <line x1="540" y1="490" x2="860" y2="490"/>
      <line x1="540" y1="530" x2="780" y2="530"/>
    </g>
    <text x="700" y="620" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#9e2b25">Love, Santa</text>
    <!-- wax seal -->
    <circle cx="700" cy="678" r="30" fill="#9e2b25" stroke="#7d201d" stroke-width="3"/>
    <text x="700" y="688" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#f4d7a1">K</text>
  </g>
</svg>
